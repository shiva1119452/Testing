name: Deploy to OpenShift

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: shiva1119452-dev

      - name: Update testing-app image
        run: |
          IMAGE="docker.io/shiva1119452/testing-app:${{ github.event.workflow_run.head_sha || github.sha }}"
          oc set image deployment/testing-app testing-app="$IMAGE"

      - name: Wait for rollout
        run: |
          oc rollout status deployment/testing-app --timeout=180s

      - name: Verify deployment
        run: |
          oc get deployment testing-app
          oc get pods -l app=testing-app